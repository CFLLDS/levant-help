site_name: Levant Help Centre
site_description: How to use the Levant portal and Energy Confidence tools. For advisers, volunteers and coordinators at delivery partners.
copyright: "&copy; LDS Consulting Limited trading as LDS Consultancy"

theme:
  name: material
  language: en
  font:
    text: Manrope
    code: JetBrains Mono
  palette:
    scheme: levant
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.tabs.link
  icon:
    logo: material/lightbulb-on-outline

extra_css:
  - assets/levant.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search

nav:
  - Home: index.md
  - Giving advice:
      - giving-advice/index.md
      - Your portfolios: giving-advice/your-portfolios.md
      - Who to contact first: giving-advice/who-to-contact-first.md
      - The advice file: giving-advice/the-advice-file.md
      - Prepare for a call or visit: giving-advice/prepare-for-a-call.md
      - Make contact: giving-advice/make-contact.md
      - Record what happened: giving-advice/record-what-happened.md
      - Property details: giving-advice/property-details.md
      - Time away: giving-advice/time-away.md
      - Evidence and the resident summary: giving-advice/evidence-and-resident-summary.md
      - What the figures mean: giving-advice/what-the-figures-mean.md
      - Where this sits in your Level 3: giving-advice/course-map.md
      - The assistant and support: giving-advice/assistant-and-support.md
  - Households and visits:
      - households-and-visits/index.md
      - Find a household: households-and-visits/find-a-household.md
      - Book a visit: households-and-visits/book-a-visit.md
      - Move or cancel a visit: households-and-visits/move-or-cancel-a-visit.md
      - Bring a new household on board: households-and-visits/new-household.md
      - Refer a job to the handyperson: households-and-visits/handyperson-referral.md
      - Return a call back: households-and-visits/call-backs.md
      - Check consent: households-and-visits/check-consent.md
      - End a case: households-and-visits/end-a-case.md
      - Quick answers: households-and-visits/quick-answers.md
